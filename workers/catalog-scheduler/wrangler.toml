name = "gaso-catalog-scheduler"
main = "index.js"
compatibility_date = "2026-11-14"
workers_dev = false

# 21:00 UTC = 15:00 hora Ciudad de México (CST UTC-6, sin horario de verano).
# Una vez al día a las 3:00 p.m.: cuando ya entraron productos de paquetería.
[triggers]
crons = ["0 21 * * *"]

[vars]
GASO_BASE_URL = "https://gaso-mx.pages.dev"
